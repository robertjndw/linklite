[package]
name = "dlcore"
version = "0.0.1"
edition = "2021"
workspace = "../../../engine"
license = "GPL-2.0-or-later"
description = "Chimera rig: compiles the LITERAL in-kernel vino cp.rs/proto.rs/ake.rs/hdcp.rs in userspace to drive a DL3 dock from userspace -- proving the control-plane encryption + AKE + post-msg0 path offline against DLM captures, and cold-starting a real dock over libusb. The reference core of the DisplayLink protocol stack."

[lib]
path = "src/lib.rs"

[dependencies]
# The crypto deps implement the userspace versions of the kernel primitives.
# AES-CTR and AES-CMAC ("Dl3Cmac") are
# built on the AES primitive inside the kernel-prelude shim, so the kernel
# cp.rs AES-CTR/CMAC math runs verbatim with no extra third-party MAC crate.
aes = "0.8"
cipher = "0.4"
sha2 = "0.10"
hmac = "0.12"
getrandom = "0.2"
# A crate literally named `kernel` so `ake.rs`'s nested `id` submodule's bare
# `use kernel::bindings;` resolves via the extern prelude, exactly like the
# real kernel crate does there (see `kernel-shim`'s own doc comment).
kernel = { package = "kernel-shim", path = "../kernel-shim" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(CONFIG_DRM_VINO_KUNIT_TEST)"] }

[features]
# `live` pulls in the USB transport (rusb via dlcore-usb) for the hardware
# coldstart binary. Off by default so the offline proof builds with zero USB deps.
live = ["dep:dlcore-usb"]
# Makes `kshim::rng::fill` deterministic once `kshim::rng::seed_rng` is called, and lets a host
# install the session clock per thread (`kshim::clock::set_clock`), so a reimplementation or a
# recorded trace can be compared byte for byte against this one. Never enable it in a shipping
# build.
oracle = []

[dependencies.dlcore-usb]
path = "../dlcore-usb"
optional = true

[[bin]]
name = "chimera-prove"
path = "src/bin/prove.rs"

# The cold-boot path: does its own AKE from scratch over libusb, no DLM, no
# handoff. This is what grows into the DLM-replacement binary. (The two
# handoff-based binaries -- takeover and live-video, which both needed an
# already-engaged DLM session -- were deliberately left out of this project;
# they live on in the dl-scripts RE tree.)
[[bin]]
name = "chimera-coldstart"
path = "src/bin/coldstart.rs"
required-features = ["live"]

# The session and EDID tests need the USB-facing modules. Before this crate joined the engine's
# workspace the engine's own `live` dependency switched them on for every test run; this keeps
# `cargo test -p dlcore` covering them.
[dev-dependencies]
dlcore = { path = ".", features = ["live"] }
